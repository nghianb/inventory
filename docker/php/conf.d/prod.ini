; Chỉ nạp ở tầng prod. Code nằm trong image và không đổi giữa hai lần deploy, nên OPcache
; không cần stat lại từng file mỗi request.
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000

; Lỗi đi ra log (stderr) chứ không ra trang: Laravel tự lo phần hiển thị.
display_errors=0
log_errors=1
expose_php=0
