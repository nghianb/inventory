  kbd { font-family: ui-monospace, monospace; font-size: .7rem; padding: 0 .3rem; border-radius: .25rem; border: 1px solid rgb(0 0 0 / .15); background: rgb(255 255 255 / .6); }

<body class="bg-gray-50 text-gray-950">
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="state"></div>

<script>
// ───────────────────────── tiện ích ─────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parseMoney = s => { s = String(s ?? '').trim().toLowerCase(); if (!s) return null; const k = s.endsWith('k'); const n = Number(s.replace(/[^\d]/g, '')); return k ? n * 1000 : n; };
const vnd = n => (n == null || n === '' || isNaN(n)) ? '—' : Number(n).toLocaleString('vi-VN') + ' ₫';
const addDays = (d, n) => new Date(d.getTime() + n * 864e5);
const fmtDate = d => d ? d.toLocaleDateString('vi-VN') : 'Không có';
const fmtDT = d => d.toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
const fmtHrs = h => `${Math.floor(h)} giờ ${Math.round((h % 1) * 60)} phút`;
const NOW = () => new Date(Date.now() + S.clockShiftH * 3600e3);
function rnd(seed, len, abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789') {
  let h = 2166136261; for (const c of String(seed)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  let s = ''; for (let i = 0; i < len; i++) { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; s += abc[Math.abs(h) % abc.length]; } return s;
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
}
function toast(m) {
  $('#toast').innerHTML = `<div class="fixed top-4 left-1/2 -translate-x-1/2 z-[60] rounded-lg bg-gray-900 text-white text-sm px-4 py-2 shadow-lg">${esc(m)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => $('#toast').innerHTML = '', 2500);
}

// Lớp CSS kiểu Filament
const card = 'bg-white rounded-xl shadow-sm ring-1 ring-gray-950/5';
const inp = 'block w-full rounded-lg border-0 bg-white ring-1 ring-gray-950/10 focus:ring-2 focus:ring-amber-500 px-3 py-1.5 text-sm shadow-sm';
const btn = {
  p: 'inline-flex items-center gap-1 rounded-lg bg-amber-500 hover:bg-amber-400 text-white font-semibold px-3 py-2 text-sm shadow-sm disabled:opacity-50',
  g: 'inline-flex items-center gap-1 rounded-lg bg-white ring-1 ring-gray-950/10 hover:bg-gray-50 font-semibold px-3 py-2 text-sm shadow-sm disabled:opacity-50',
  d: 'inline-flex items-center gap-1 rounded-lg bg-red-600 hover:bg-red-500 text-white font-semibold px-3 py-2 text-sm shadow-sm disabled:opacity-40',
  link: 'text-sm font-semibold text-amber-600 hover:underline',
  linkD: 'text-sm font-semibold text-red-600 hover:underline',
};
const badge = (t, c = 'gray') => {
  const m = { gray: 'bg-gray-50 text-gray-600 ring-gray-500/20', green: 'bg-green-50 text-green-700 ring-green-600/20', amber: 'bg-amber-50 text-amber-700 ring-amber-600/20', red: 'bg-red-50 text-red-700 ring-red-600/20' };
  return `<span class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium ring-1 ring-inset ${m[c]}">${t}</span>`;
};

// ───────────────────────── dữ liệu giả ─────────────────────────
const CHANNELS = [
  { id: 1, name: 'Shopee', icon: '🛒', type: 'thủ công', requireOrder: true },
  { id: 2, name: 'Facebook', icon: '💬', type: 'thủ công', requireOrder: false },
  { id: 3, name: 'Zalo', icon: '📱', type: 'thủ công', requireOrder: false },
  { id: 4, name: 'Website', icon: '🌐', type: 'API', requireOrder: true },
];
const MANUAL = CHANNELS.filter(c => c.type === 'thủ công');
const PRODUCTS = [
  { code: 'NETFLIX-1M', name: 'Netflix Premium 1 tháng', type: 'Tài khoản', unit: 'TK', stock: 37, low: 10, warrantyDays: 30, expiryDays: 32,
    fields: [{ k: 'email', label: 'Email', s: true }, { k: 'password', label: 'Mật khẩu', s: true }, { k: 'profile', label: 'Profile', s: false }],
    template: '🎬 {ten_san_pham} (đơn {ma_don})\nEmail: {email}\nMật khẩu: {password}\nProfile của bạn: {profile}\nHạn sử dụng: {han_su_dung} · Bảo hành đến: {han_bao_hanh}\n⚠️ Chỉ dùng đúng profile, không đổi mật khẩu.' },
  { code: 'WIN11-PRO', name: 'Windows 11 Pro key', type: 'Mã dùng một lần', unit: 'MA', stock: 210, low: 20, warrantyDays: 7, expiryDays: null,
    fields: [{ k: 'key', label: 'Key', s: true }], template: null },
  { code: 'STEAM-50', name: 'Steam Wallet 50 USD', type: 'Mã dùng một lần', unit: 'MA', stock: 4, low: 5, warrantyDays: 3, expiryDays: 365,
    fields: [{ k: 'serial', label: 'Serial', s: false }, { k: 'code', label: 'Mã thẻ', s: true }],
    template: 'Thẻ {ten_san_pham}\nSerial: {serial}\nMã thẻ: {code}\nNạp tại store.steampowered.com/account/redeemwalletcode' },
  { code: 'CANVA-1Y', name: 'Canva Pro 1 năm', type: 'Tài khoản', unit: 'TK', stock: 0, low: 3, warrantyDays: 180, expiryDays: 365,
    fields: [{ k: 'email', label: 'Email', s: true }, { k: 'password', label: 'Mật khẩu', s: true }], template: null },
];
const P = code => PRODUCTS.find(p => p.code === code);
const CH = id => CHANNELS.find(c => c.id == id);

const newDraft = () => ({ channelId: null, orderNo: '', customer: '', note: '', lines: [{ code: '', qty: 1, price: '' }] });
let S = {
  variant: new URLSearchParams(location.search).get('variant') || 'A',
  user: 'Lan', role: 'Bán hàng', clockShiftH: 0,
  screen: 'create', step: 1, draft: newDraft(), cmd: '', q: '',
  addTo: false, dispatch: null, result: null, revealed: new Set(),
  modal: null, rep: null, edit: null, errors: null, shortage: null, confirmBar: false,
  audit: [], ledger: [], seq: 12, delSeq: 0, panelOpen: true,
  orders: [{ channel: 1, orderNo: 'SP240901ABC', code: 'PX-20260901-0007' }],
};

// ───────────────────────── nghiệp vụ giả (dùng chung) ─────────────────────────
function makeSlot(p) {
  p.picked = (p.picked || 0) + 1; const i = p.picked; let unitId, slotNo, content, note = '';
  if (p.type === 'Tài khoản') {
    // Thứ tự xuất: 2 slot còn lại của Tài khoản đã giao dở trước, sau đó mỗi Tài khoản mới 5 slot
    const u = i <= 2 ? 0 : Math.ceil((i - 2) / 5); slotNo = i <= 2 ? 3 + i : ((i - 3) % 5) + 1; const n = 412 + u;
    unitId = `${p.unit}-${n}`; if (u === 0) note = 'Tài khoản đã giao dở';
    content = Object.fromEntries(p.fields.map(f => [f.k,
      f.k === 'email' ? `${p.code.split('-')[0].toLowerCase()}${n}@kho-mail.vn` : f.k === 'password' ? rnd(p.code + n, 12, 'abcdefghjkmnpqrstuvwxyz23456789@#') : `P${slotNo}`]));
  } else {
    const n = 8800 + i; unitId = `${p.unit}-${n}`; slotNo = 1;
    content = Object.fromEntries(p.fields.map(f => [f.k,
      f.k === 'key' ? [0, 1, 2, 3, 4].map(j => rnd(p.code + n + j, 5)).join('-') : f.k === 'serial' ? 'SW' + rnd(p.code + n, 10, '0123456789') : rnd(p.code + n + 'c', 16)]));
  }
  const expiry = p.expiryDays ? addDays(NOW(), p.expiryDays - (i % 3)) : null;
  return { unitId, slotNo, content, expiry, note };
}
function deliverOne(disp, p, lineIdx, extra = {}) {
  const s = makeSlot(p); p.stock--;
  const at = NOW(); let w = addDays(at, p.warrantyDays); if (s.expiry && s.expiry < w) w = s.expiry;
  const d = { id: ++S.delSeq, code: p.code, lineIdx, ...s, at, warrantyEnd: w, status: 'Đã giao', ...extra };
  disp.deliveries.push(d);
  S.ledger.push({ at, who: S.user, what: `Slot ${s.unitId}#${s.slotNo}: Còn hàng → Đã giữ → Đã giao`, ref: disp.code });
  return d.id;
}
function msg(disp, d, masked) {
  const p = P(d.code);
  const vars = { ten_san_pham: p.name, ma_don: disp.orderNo, han_su_dung: fmtDate(d.expiry), han_bao_hanh: fmtDate(d.warrantyEnd) };
  p.fields.forEach(f => vars[f.k] = masked && f.s ? '••••••••' : d.content[f.k]);
  const tpl = p.template ?? ['{ten_san_pham}', ...p.fields.map(f => `${f.label}: {${f.k}}`), 'Hạn sử dụng: {han_su_dung}', 'Hạn bảo hành: {han_bao_hanh}'].join('\n');
  return tpl.replace(/\{(\w+)\}/g, (m, k) => vars[k] ?? m);
}
const SEP = '\n\n────────────\n\n';
function inlineContent(d) {
  const p = P(d.code);
  return p.fields.map(f => `${f.label}: ${f.s && !S.revealed.has(d.id) ? '••••••' : d.content[f.k]}`).join(' · ');
}
function logReveal(ids, reason) {
  ids.forEach(id => {
    const d = S.dispatch.deliveries.find(x => x.id === id);
    S.audit.push({ at: NOW(), who: S.user, slot: `${d.unitId}#${d.slotNo}`, ctx: `Giao hàng ${S.dispatch.code}`, reason });
  });
}
const draftLines = () => S.draft.lines.filter(l => l.code);
function totalsText() {
  const ls = draftLines(); const slots = ls.reduce((s, l) => s + (+l.qty || 0), 0);
  const prices = ls.map(l => parseMoney(l.price)).filter(x => x != null);
  return `<b>${ls.length}</b> dòng · <b>${slots}</b> Slot · Tổng Giá bán <b>${prices.length ? vnd(prices.reduce((a, b) => a + b, 0)) : '—'}</b>`;
}
const liveTotals = () => document.querySelectorAll('[data-live=totals]').forEach(el => el.innerHTML = totalsText());
function stockBadge(p) {
  if (p.stock === 0) return badge('Tồn bán được: 0 · hết hàng', 'red');
  if (p.stock <= p.low) return badge(`Tồn bán được: ${p.stock} · sắp hết`, 'amber');
  return badge(`Tồn bán được: ${p.stock}`, 'green');
}
function statusBadge(d) {
  if (d.status !== 'Đã giao') return badge(d.status, 'gray');
  return badge('Đã giao', 'green') + (d.replaces ? ' ' + badge('Giao thay', 'amber') : '');
}
function setDraft(k, v) { S.draft[k] = v; }
function setLine(i, k, v) { S.draft.lines[i][k] = v; liveTotals(); }
function addLine() { S.draft.lines.push({ code: '', qty: 1, price: '' }); render(); }
function rmLine(i) { S.draft.lines.splice(i, 1); render(); }

function validate(onlyOrder = false) {
  const d = S.draft, e = []; const ch = CH(d.channelId);
  if (!S.addTo) {
    if (!ch) e.push('Chọn Kênh bán.');
    if (ch?.requireOrder && !d.orderNo.trim()) e.push(`Kênh ${ch.name} bắt buộc mã đơn ngoài.`);
    const dup = ch && d.orderNo.trim() && S.orders.find(o => o.channel == ch.id && o.orderNo === d.orderNo.trim());
    if (dup) e.push(`Mã đơn ${esc(d.orderNo)} đã dùng trong ${ch.name} ở phiếu <a href="#" onclick="return false" class="underline font-semibold">${dup.code}</a>.`);
  }
  if (onlyOrder) return e;
  if (S.variant === 'C') parseCmd(S.cmd).filter(x => x.err).forEach(x => e.push(`Dòng ${x.n}: ${esc(x.err)}`));
  const ls = draftLines(); if (!ls.length) e.push('Thêm ít nhất một Dòng xuất.');
  const seen = new Set();
  ls.forEach(l => {
    if (seen.has(l.code)) e.push(`${l.code} có ở hai dòng: gộp vào một dòng.`); seen.add(l.code);
    if (!(+l.qty >= 1)) e.push(`${l.code}: số lượng phải từ 1.`);
  });
  const total = ls.reduce((s, l) => s + (+l.qty || 0), 0); if (total > 1000) e.push(`Tối đa 1.000 Slot mỗi phiếu (đang ${total}).`);
  return e;
}
function errorsBox() {
  if (!S.errors?.length) return '';
  return `<div class="rounded-xl bg-red-50 ring-1 ring-red-600/20 p-4 mb-4 text-sm text-red-700"><p class="font-semibold mb-1">Chưa xuất được</p><ul class="list-disc pl-5">${S.errors.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
}
function shortageBox() {
  if (!S.shortage) return '';
  return `<div class="rounded-lg bg-red-50 ring-1 ring-red-600/20 p-3 text-sm text-red-700 mt-3"><p class="font-semibold">Không đủ Tồn bán được. Chưa giao Slot nào.</p>
    <ul class="list-disc pl-5 mt-1">${S.shortage.map(x => `<li>${x.code} (${esc(x.name)}): cần ${x.want}, còn ${x.have}</li>`).join('')}</ul></div>`;
}
function confirmSummary() {
  const d = S.draft, ch = CH(d.channelId), ls = draftLines();
  return `<dl class="grid grid-cols-3 gap-y-1 text-sm mb-3">
      <dt class="text-gray-500">Kênh bán</dt><dd class="col-span-2 font-medium">${esc(ch?.name)}</dd>
      <dt class="text-gray-500">Mã đơn ngoài</dt><dd class="col-span-2 font-medium">${d.orderNo.trim() ? esc(d.orderNo) : '<i class="text-gray-500">tự sinh khi xác nhận</i>'}</dd>
      <dt class="text-gray-500">Khách</dt><dd class="col-span-2">${esc(d.customer) || '—'}</dd>
    </dl>
    <table class="w-full text-sm"><thead class="text-gray-500 text-left"><tr><th class="py-1">Sản phẩm</th><th class="text-right">SL</th><th class="text-right">Giá bán</th></tr></thead>
    <tbody>${ls.map(l => `<tr class="border-t"><td class="py-1.5">${esc(P(l.code).name)} <span class="text-xs text-gray-500">${l.code}</span></td><td class="text-right">${l.qty}</td><td class="text-right">${vnd(parseMoney(l.price))}</td></tr>`).join('')}</tbody>
    <tfoot><tr class="border-t font-semibold"><td class="py-1.5">Tổng</td><td class="text-right">${ls.reduce((s, l) => s + (+l.qty || 0), 0)}</td><td class="text-right">${vnd(ls.reduce((s, l) => s + (parseMoney(l.price) || 0), 0) || null)}</td></tr></tfoot></table>
    <p class="text-xs text-gray-500 mt-2">Nội dung mã chỉ hiện sau khi xác nhận.</p>`;
}

function askConfirm() {
  const e = validate(); S.shortage = null;
  if (e.length) { S.errors = e; render(); return; }
  S.errors = null;
  if (S.variant === 'A') S.modal = 'confirm';
  if (S.variant === 'B') S.step = 3;
  if (S.variant === 'C') S.confirmBar = true;
  render();
}
function submitDraft() {
  const d = S.draft, ls = draftLines();
  const short = ls.map(l => ({ l, p: P(l.code) })).filter(x => +x.l.qty > x.p.stock);
  if (short.length) { S.shortage = short.map(x => ({ code: x.p.code, name: x.p.name, want: +x.l.qty, have: x.p.stock })); render(); return; }
  let disp = S.dispatch;
  if (!S.addTo) {
    const code = `PX-20260914-${String(++S.seq).padStart(4, '0')}`;
    disp = { code, channel: +d.channelId, orderNo: d.orderNo.trim() || code, customer: d.customer, note: d.note, lines: [], deliveries: [], history: [], createdAt: NOW(), createdBy: S.user };
    S.orders.push({ channel: disp.channel, orderNo: disp.orderNo, code });
    S.dispatch = disp;
  }
  const kind = S.addTo ? 'Giao thêm' : 'Giao bán'; const ids = [];
  ls.forEach(l => {
    const p = P(l.code); const li = disp.lines.push({ code: l.code, qty: +l.qty, price: l.price, kind, at: NOW() }) - 1;
    for (let i = 0; i < +l.qty; i++) ids.push(deliverOne(disp, p, li));
  });
  showResult(ids, S.addTo ? 'Giao thêm' : 'Xuất kho');
}
function showResult(ids, title) {
  const masked = ids.length >= 50;
  S.result = { ids, title, sel: 0, copied: new Set(), masked };
  if (!masked) logReveal(ids, 'hiển thị lần đầu');
  S.draft = newDraft(); S.addTo = false; S.step = 1; S.cmd = ''; S.confirmBar = false;
  S.modal = null; S.rep = null; S.errors = null; S.shortage = null; S.screen = 'result';
  render();
}
function resultData() {
  const disp = S.dispatch; const ds = S.result.ids.map(id => disp.deliveries.find(x => x.id === id));
  return { disp, ds, masked: S.result.masked };
}
function copyOne(id) {
  const disp = S.dispatch, d = disp.deliveries.find(x => x.id === id);
  copyText(msg(disp, d, false)); S.result.copied.add(id);
  const i = S.result.ids.indexOf(id); if (S.variant === 'C' && i < S.result.ids.length - 1) S.result.sel = i + 1;
  toast(`Đã copy ${d.unitId} · Slot ${d.slotNo} (Copy không ghi nhật ký)`); render();
}
function copyAll() {
  const { disp, ds } = resultData();
  copyText(ds.map(d => msg(disp, d, false)).join(SEP)); ds.forEach(d => S.result.copied.add(d.id));
  toast(`Đã copy ${ds.length} Slot`); render();
}
function download(kind) {
  const { disp, ds } = resultData(); let text, type;
  if (kind === 'txt') { text = ds.map(d => msg(disp, d, false)).join(SEP); type = 'text/plain'; }
  else {
    const fields = [...new Map(ds.flatMap(d => P(d.code).fields).map(f => [f.k, f])).values()];
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    text = [['San pham', 'Don vi hang', 'Slot', ...fields.map(f => f.label), 'Han su dung', 'Han bao hanh'].map(q).join(','),
      ...ds.map(d => [d.code, d.unitId, d.slotNo, ...fields.map(f => d.content[f.k]), fmtDate(d.expiry), fmtDate(d.warrantyEnd)].map(q).join(','))].join('\n');
    type = 'text/csv';
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = `${disp.code}.${kind}`; a.click(); URL.revokeObjectURL(a.href);
  logReveal(S.result.ids, `tải file ${kind.toUpperCase()}`); toast(`Đã tải ${disp.code}.${kind} (ghi Nhật ký xem mã)`); render();
}
function leaveResult() {
  const left = S.result.ids.length - S.result.copied.size;
  if (S.variant === 'C' && !S.result.masked && left > 0 && !confirm(`Còn ${left} Slot chưa copy. Rời màn kết quả? Xem lại sau sẽ ghi Nhật ký xem mã.`)) return;
  S.result = null; S.revealed = new Set(); S.screen = 'detail'; render();
}
function reveal(id) {
  const d = S.dispatch.deliveries.find(x => x.id === id);
  if (S.revealed.has(id)) { S.revealed.delete(id); render(); return; }
  if (S.role !== 'Quản trị' && NOW() > d.warrantyEnd) return toast('Hết Hạn bảo hành: chỉ Quản trị xem lại được.');
  if (!confirm(`Xem nội dung đầy đủ ${d.unitId} · Slot ${d.slotNo}?\nLần xem được ghi vào Nhật ký xem mã (ngữ cảnh: Giao hàng ${S.dispatch.code}).`)) return;
  S.revealed.add(id); logReveal([id], 'xem lại'); render();
}
function startAdd() {
  const disp = S.dispatch;
  S.addTo = true; S.draft = { channelId: disp.channel, orderNo: disp.orderNo, customer: disp.customer, note: '', lines: S.variant === 'B' ? [] : [{ code: '', qty: 1, price: '' }] };
  S.step = 2; S.cmd = ''; S.errors = null; S.shortage = null; S.screen = 'create'; render();
}
function cancelCreate() {
  S.errors = null; S.shortage = null; S.confirmBar = false; S.modal = null;
  if (S.addTo) { S.addTo = false; S.draft = newDraft(); S.screen = 'detail'; } else { S.draft = newDraft(); S.step = 1; S.cmd = ''; }
  render();
}

    </fieldset>
    ${r.sent === 'roi' ? `<fieldset class="rounded-lg ring-1 ring-amber-600/20 bg-amber-50 p-3"><legend class="font-medium px-1">Nội dung đã lộ. Xử lý Đơn vị hàng ${d.unitId}?</legend>

      <label class="flex gap-2 items-start mt-1"><input type="radio" name="vu" ${r.voidUnit ? 'checked' : ''} onchange="S.rep.voidUnit=true;render()"> <span>Huỷ hàng cả Đơn vị hàng<span class="block text-xs text-gray-500">Các Slot còn trong kho của nó không bán được nữa</span></span></label>
      <p class="text-xs text-gray-500 mt-2">Hệ thống không tự khoá Tài khoản.</p></fieldset>` : ''}
    ${r.err ? `<p class="text-red-600">${esc(r.err)}</p>` : ''}
    <p class="text-xs text-gray-500">Giao thay không tạo Báo lỗi và không tính vào Tỉ lệ lỗi nhà cung cấp.</p>`}

}
function replaceFooter() {
  const d = S.dispatch.deliveries.find(x => x.id === S.rep.id); const blocked = !replaceWindow(d).ok && S.role !== 'Quản trị';
  return `<button class="${btn.g}" onclick="closeModal()">Đóng</button><button class="${btn.d}" onclick="doReplace()" ${blocked ? 'disabled' : ''}>Huỷ Slot cũ và giao Slot mới</button>`;
}
function doReplace() {
  const disp = S.dispatch, r = S.rep, d = disp.deliveries.find(x => x.id === r.id), w = replaceWindow(d), p = P(r.code);
  if (!w.ok && S.role !== 'Quản trị') return;
  if (!w.ok && !r.reason.trim()) { r.err = 'Quá 24 giờ: Quản trị phải ghi lý do.'; render(); return; }
  if (p.stock < 1) { r.err = `${p.name} hết Tồn bán được.`; render(); return; }
  d.status = 'Đã huỷ (giao nhầm)';
  S.ledger.push({ at: NOW(), who: S.user, what: `Slot ${d.unitId}#${d.slotNo}: Đã giao → Đã huỷ (giao nhầm)`, ref: disp.code });
  if (r.sent === 'roi' && r.voidUnit) S.ledger.push({ at: NOW(), who: S.user, what: `Đơn vị hàng ${d.unitId}: Hoạt động → Đã huỷ (lộ nội dung)`, ref: disp.code });
  let li = d.lineIdx;
  if (p.code !== d.code) li = disp.lines.push({ code: p.code, qty: 1, price: '', kind: 'Giao thay', at: NOW() }) - 1;
  const nid = deliverOne(disp, p, li, { replaces: d.id }); d.replacedBy = nid;
  showResult([nid], 'Giao thay');
}

// Sửa phiếu
function openEdit() {
  const d = S.dispatch;
  S.edit = { orderNo: d.orderNo, customer: d.customer, note: d.note, prices: d.lines.map(l => l.price ?? ''), err: null };
  S.modal = 'edit'; render();
}
function saveEdit() {
  const disp = S.dispatch, e = S.edit;
  const dup = S.orders.find(o => o.channel === disp.channel && o.orderNo === e.orderNo.trim() && o.code !== disp.code);
  if (dup) { e.err = `Mã đơn đã dùng ở phiếu ${dup.code}.`; render(); return; }
  const ch = (field, from, to) => { if (String(from ?? '') !== String(to ?? '')) disp.history.push({ at: NOW(), who: S.user, field, from, to }); };
  ch('Mã đơn ngoài', disp.orderNo, e.orderNo.trim()); ch('Khách', disp.customer, e.customer); ch('Ghi chú', disp.note, e.note);
  disp.lines.forEach((l, i) => ch(`Giá bán dòng ${l.code}`, l.price, e.prices[i]));
  disp.orderNo = e.orderNo.trim(); disp.customer = e.customer; disp.note = e.note; disp.lines.forEach((l, i) => l.price = e.prices[i]);
  S.orders.find(o => o.code === disp.code).orderNo = disp.orderNo;
  closeModal(); toast('Đã lưu, ghi vào lịch sử phiếu');
}
function historyList(disp) {
  if (!disp.history.length) return '<p class="text-sm text-gray-500">Chưa sửa lần nào.</p>';
  return `<ul class="text-sm space-y-1">${disp.history.slice().reverse().map(h => `<li><span class="text-gray-500">${fmtDT(h.at)} · ${h.who}</span> · ${esc(h.field)}: <s class="text-gray-500">${esc(h.from) || '∅'}</s> → ${esc(h.to) || '∅'}</li>`).join('')}</ul>`;
}

function parseCmd(t) {
  const seen = {};
  return t.split('\n').map((raw, i) => ({ raw, n: i + 1 })).filter(x => x.raw.trim()).map(x => {
    const tk = x.raw.trim().split(/\s+/); const code = tk[0].toUpperCase(); const p = P(code);
    const qty = tk[1] ? parseInt(tk[1].replace(/^x/i, '')) : 1; const price = tk.slice(2).join('');
    let err = null, warn = null;
    if (!p) err = 'Không có Mã sản phẩm này';
    else if (!(qty >= 1)) err = 'Số lượng không hợp lệ';
    else if (seen[code]) err = `Trùng Sản phẩm với dòng ${seen[code]}`;
    else if (qty > p.stock) warn = `Thiếu: còn ${p.stock}`;
    if (p && !seen[code]) seen[code] = x.n;
    return { ...x, code, p, qty, price, err, warn };
  });
}

    disp.deliveries.forEach(d => { const l = disp.lines[d.lineIdx]; const kind = d.replaces ? 'Giao thay' : l.kind; const key = kind + '|' + d.at.getTime(); (groups[key] ??= { kind, at: d.at, ds: [] }).ds.push(d); });
    const events = [...Object.values(groups), ...disp.history.map(h => ({ kind: 'Sửa', at: h.at, h }))].sort((a, b) => b.at - a.at);
    const dot = { 'Giao bán': 'bg-green-500', 'Giao thêm': 'bg-sky-500', 'Giao thay': 'bg-amber-500', 'Sửa': 'bg-gray-400' };
    return `
    <div class="${card} px-4 py-3 mb-4 flex flex-wrap items-center gap-x-4 gap-y-2 text-sm">
      <span class="text-lg font-bold">${disp.code}</span>${badge('Hoàn tất', 'green')}
      <span>${ch.icon} ${ch.name} #${esc(disp.orderNo)}</span><span class="text-gray-600 truncate max-w-xs">${esc(disp.customer)}</span>
      <span class="font-semibold">${vnd(total || null)}</span><span class="grow"></span>
      <button class="${btn.g}" onclick="openEdit()">Sửa</button><button class="${btn.p}" onclick="startAdd()">+ Giao thêm</button>
    </div>
    <ol class="${card} p-5">${events.map(ev => `<li class="relative pl-7 pb-5 last:pb-0 border-l border-gray-200 ml-2">
      <span class="absolute -left-[7px] top-1 w-3.5 h-3.5 rounded-full ring-4 ring-white ${dot[ev.kind]}"></span>
      <p class="text-sm"><b>${ev.kind}</b> <span class="text-gray-500">· ${fmtDT(ev.at)} · ${disp.createdBy}</span></p>
      ${ev.h ? `<p class="text-sm text-gray-600">${esc(ev.h.field)}: <s>${esc(ev.h.from) || '∅'}</s> → ${esc(ev.h.to) || '∅'}</p>` :
      ev.ds.map(d => `<div class="mt-1.5 ${d.status !== 'Đã giao' ? 'opacity-60' : ''}">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-sm">
          <span class="font-mono text-xs">${d.code} · ${d.unitId}#${d.slotNo}</span><span class="font-mono text-xs text-gray-600">${esc(inlineContent(d))}</span>${statusBadge(d)}
          <span class="text-xs text-gray-500">BH đến ${fmtDate(d.warrantyEnd)}</span>
          ${d.status === 'Đã giao' ? `<button class="${btn.link} !text-xs" onclick="reveal(${d.id})">${S.revealed.has(d.id) ? 'che' : 'xem mã'}</button><button class="${btn.linkD} !text-xs" onclick="${S.rep?.id === d.id ? 'closeModal()' : `openReplace(${d.id})`}">${S.rep?.id === d.id ? 'đóng giao thay' : 'giao thay'}</button>` : ''}
        </div>
        ${S.rep?.id === d.id ? `<div class="mt-2 rounded-lg ring-1 ring-red-600/20 bg-red-50/30 p-4 max-w-xl">${replaceForm()}<div class="flex justify-end gap-2 mt-3">${replaceFooter()}</div></div>` : ''}
      </div>`).join('')}
    </li>`).join('')}</ol>`;
  },
};

const VARIANTS = { A: VA, B: VB, C: VC };
if (!VARIANTS[S.variant]) S.variant = 'A';

// ───────────────────────── khung app, bảng trạng thái, thanh đổi phương án ─────────────────────────
function shell(inner) {
  const nav = ['Bảng điều khiển', 'Sản phẩm', 'Lô nhập', 'Phiếu xuất', 'Báo lỗi', 'Khiếu nại NCC', 'Báo cáo'];
  return `<div class="min-h-screen flex">
    <aside class="w-56 bg-white border-r hidden lg:block"><div class="h-14 flex items-center px-5 font-bold">📦 Kho hàng số</div>
      <nav class="px-3 space-y-0.5 text-sm">${nav.map(n => `<a class="block rounded-lg px-3 py-2 ${n === 'Phiếu xuất' ? 'bg-gray-100 text-amber-600 font-semibold' : 'text-gray-700'}">${n}</a>`).join('')}</nav></aside>
    <div class="flex-1 min-w-0">
      <header class="h-14 bg-white border-b flex items-center justify-end px-4 sm:px-6 gap-3 text-sm">
        ${badge('PROTOTYPE', 'amber')}<span class="grow"></span><span>${S.user} · <b>${S.role}</b></span><span class="w-8 h-8 rounded-full bg-amber-500 text-white grid place-items-center font-bold">L</span>
      </header>
      <main class="px-4 sm:px-6 py-6 max-w-6xl mx-auto pb-44">${inner}</main>
    </div></div>`;
}
function statePanel() {
  const a = S.audit.slice(-8).reverse(), l = S.ledger.slice(-6).reverse();
  return `<details ${S.panelOpen ? 'open' : ''} ontoggle="S.panelOpen=this.open" class="fixed right-3 bottom-16 z-30 w-80 max-w-[calc(100vw-1.5rem)] rounded-xl bg-gray-900/95 text-gray-100 text-xs shadow-2xl">
    <summary class="cursor-pointer px-3 py-2 font-semibold">🧪 Trạng thái giả lập</summary>
    <div class="px-3 pb-3 space-y-2 max-h-[55vh] overflow-auto">
      <div class="flex flex-wrap gap-2 items-center">Vai trò <select class="text-gray-900 rounded px-1" onchange="S.role=this.value;render()">${['Bán hàng', 'Quản trị'].map(r => `<option ${r === S.role ? 'selected' : ''}>${r}</option>`).join('')}</select>
        · Giờ: ${fmtDT(NOW())} <button class="underline" onclick="S.clockShiftH+=25;render()">+25 giờ</button>${S.clockShiftH ? ` <button class="underline" onclick="S.clockShiftH=0;render()">về giờ thật</button>` : ''}</div>
      <div class="flex flex-wrap gap-1.5">
        <button class="rounded bg-gray-700 hover:bg-gray-600 px-2 py-1" onclick="seedDispatch()">Mở phiếu mẫu đã Hoàn tất</button>
        <button class="rounded bg-gray-700 hover:bg-gray-600 px-2 py-1" onclick="S.addTo=false;S.draft=newDraft();S.step=1;S.cmd='';S.result=null;S.screen='create';closeModal()">Tạo phiếu mới</button>
        <button class="rounded bg-gray-700 hover:bg-gray-600 px-2 py-1" onclick="location.reload()">Reset</button></div>
      <div>Màn: <b>${S.screen}</b>${S.dispatch ? ` · ${S.dispatch.code}: ${S.dispatch.deliveries.length} lần giao` : ''}</div>
      <div><p class="font-semibold text-amber-300">Tồn bán được</p>${PRODUCTS.map(p => `${p.code}: <b>${p.stock}</b>`).join(' · ')}</div>
      <div><p class="font-semibold text-amber-300">Nhật ký xem mã (${S.audit.length})</p>${a.map(x => `<div class="text-gray-300">${fmtDT(x.at)} · ${x.who} · ${x.slot} · ${x.reason}</div>`).join('') || '<div class="text-gray-500">trống</div>'}<div class="text-gray-500">Copy không ghi nhật ký.</div></div>
      <div><p class="font-semibold text-amber-300">Sổ biến động kho (${S.ledger.length})</p>${l.map(x => `<div class="text-gray-300">${fmtDT(x.at)} · ${esc(x.what)}</div>`).join('') || '<div class="text-gray-500">trống</div>'}</div>
    </div></details>`;
}
function switcher() {
  return `<div class="fixed bottom-3 left-1/2 -translate-x-1/2 z-50 flex items-center gap-1 rounded-full bg-black text-white shadow-2xl px-2 py-1.5 text-sm ring-2 ring-fuchsia-500 whitespace-nowrap">
    <button class="px-2 hover:text-fuchsia-300" onclick="cycle(-1)" title="Phương án trước (←)">←</button>
    <span class="px-2 font-medium">${S.variant} (${VARIANTS[S.variant].name})</span>
    <button class="px-2 hover:text-fuchsia-300" onclick="cycle(1)" title="Phương án sau (→)">→</button></div>`;
}
function cycle(n) {
  const k = Object.keys(VARIANTS); const from = S.variant; S.variant = k[(k.indexOf(S.variant) + n + k.length) % k.length];
  try { const u = new URL(location); u.searchParams.set('variant', S.variant); history.replaceState(null, '', u); } catch { /* file:// ở vài trình duyệt không cho đổi URL */ }
  if (S.variant === 'C' && from !== 'C') S.cmd = draftToCmd();
  if (S.variant === 'B' && S.screen === 'create') S.step = S.addTo ? 2 : 1;
  if (S.variant === 'A' && S.screen === 'create' && !S.draft.lines.length) S.draft.lines.push({ code: '', qty: 1, price: '' });
  S.confirmBar = false; S.shortage = null; S.errors = null;
  if (S.modal === 'confirm') S.modal = null;
  if (S.rep) S.modal = S.variant === 'C' ? null : 'replace';
  render();
}
function seedDispatch() {
  const save = S.clockShiftH;
  const disp = { code: 'PX-20260913-0041', channel: 1, orderNo: 'SP240912XYZ', customer: 'Minh Anh · 0901 234 567 · shopee.vn/chat/minhanh', note: 'Khách quen', lines: [], deliveries: [], history: [], createdBy: S.user };
  S.dispatch = disp;
  S.clockShiftH = save - 26; disp.createdAt = NOW();
  let li = disp.lines.push({ code: 'STEAM-50', qty: 1, price: '1250000', kind: 'Giao bán', at: NOW() }) - 1; deliverOne(disp, P('STEAM-50'), li);
  S.clockShiftH = save - 3;
  li = disp.lines.push({ code: 'NETFLIX-1M', qty: 2, price: '170000', kind: 'Giao thêm', at: NOW() }) - 1; deliverOne(disp, P('NETFLIX-1M'), li); deliverOne(disp, P('NETFLIX-1M'), li);
  S.clockShiftH = save;
  if (!S.orders.find(o => o.code === disp.code)) S.orders.push({ channel: 1, orderNo: disp.orderNo, code: disp.code });
  S.addTo = false; S.result = null; S.revealed = new Set(); S.screen = 'detail'; S.modal = null; S.rep = null; S.confirmBar = false;
  render();
}
function render() {
  const v = VARIANTS[S.variant];
  if (S.screen === 'result' && !S.result) S.screen = S.dispatch ? 'detail' : 'create';
  if (S.screen === 'detail' && !S.dispatch) S.screen = 'create';
  $('#app').innerHTML = shell(v[S.screen]());
  $('#modal').innerHTML = S.modal ? MODALS[S.modal]() : '';
  $('#state').innerHTML = statePanel();
  $('#switcher').innerHTML = switcher();
  if (S.confirmBar) $('#c-confirm')?.focus();
}
document.addEventListener('keydown', e => {
  const typing = e.target.matches('input,textarea,select,[contenteditable]');
  if (e.key === 'Escape' && S.confirmBar) { S.confirmBar = false; S.shortage = null; render(); return; }
  if (e.key === 'Escape' && (S.modal || S.rep)) { closeModal(); return; }
  if (S.variant === 'C' && S.screen === 'create' && !S.addTo && e.altKey && /^[1-3]$/.test(e.key)) { e.preventDefault(); S.draft.channelId = MANUAL[+e.key - 1].id; render(); return; }
  if (typing) return;
  if (e.key === 'ArrowLeft') return cycle(-1);
  if (e.key === 'ArrowRight') return cycle(1);
  if (S.variant === 'C' && S.screen === 'result' && S.result) {
    const r = S.result, n = r.ids.length;
    if (['ArrowDown', 'j'].includes(e.key)) { e.preventDefault(); r.sel = Math.min(n - 1, r.sel + 1); render(); }
    else if (['ArrowUp', 'k'].includes(e.key)) { e.preventDefault(); r.sel = Math.max(0, r.sel - 1); render(); }
    else if (e.key === 'c' && !r.masked) copyOne(r.ids[r.sel]);
    else if (e.key === 'a') copyAll();
    else if (e.key === 'Escape') leaveResult();
  }
});
render();
</script>
</body>
