name: inventory

services:
  app:
    build:
      context: docker/php
    image: inventory-app:dev
    # Khoá mã hoá không khớp dấu vân tay trong DB thì không khởi động.
    command: sh -c "php artisan inventory:keys:verify && exec php artisan serve --host=0.0.0.0 --port=8000"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Job kiểm tra Lô nhập. Worker từ chối khởi động và từ chối từng job khi khoá không khớp.
  queue:
    image: inventory-app:dev
    command: php artisan queue:work --tries=1
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  # Lịch chạy: mỗi giờ cho hết hạn Lô nhập chưa xác nhận quá 24 giờ và xoá nội dung tạm.
  scheduler:
    image: inventory-app:dev
    command: php artisan schedule:work
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
